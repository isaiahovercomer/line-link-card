<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 網頁圖卡圖示：霧藍底、淺底圖卡、藍色預覽圖上有連結鏈環、下方一條按鈕 -->
  <rect width="512" height="512" fill="#385A7C"/>
  <!-- 圖卡 -->
  <rect x="104" y="96" width="304" height="320" rx="34" fill="#F1F5F9"/>
  <!-- 預覽圖 -->
  <path d="M104 130a34 34 0 0 1 34-34h236a34 34 0 0 1 34 34v122H104z" fill="#56789A"/>
  <!-- 連結鏈環 -->
  <g fill="none" stroke="#F1F5F9" stroke-width="20" transform="rotate(-45 256 174)">
    <rect x="186" y="151" width="84" height="46" rx="23"/>
    <rect x="242" y="151" width="84" height="46" rx="23"/>
  </g>
  <!-- 標題線 -->
  <rect x="140" y="282" width="190" height="20" rx="10" fill="#1F2A33"/>
  <!-- 按鈕 -->
  <rect x="140" y="332" width="232" height="50" rx="14" fill="#1F2A33"/>
</svg>
